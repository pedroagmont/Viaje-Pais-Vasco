<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>País Vasco en 4 días — Mapa del itinerario</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root {
    --teal: #123c44;
    --teal-light: #1c5763;
    --cream: #faf6ef;
    --coral: #c0483c;
    --gold: #d9a441;
    --ink: #24333a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; font-family: 'Helvetica Neue', Arial, sans-serif; background: var(--cream); color: var(--ink); }

  .header {
    background: linear-gradient(120deg, var(--teal) 0%, var(--teal-light) 100%);
    color: var(--cream);
    padding: 16px 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
  }
  .header h1 { font-size: 18px; margin: 0; font-weight: 700; }
  .header .sub { font-size: 12px; color: #b9d2d6; margin-top: 2px; }

  .legend {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
  }
  .legend .item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11.5px;
    background: rgba(255,255,255,0.08);
    padding: 4px 10px;
    border-radius: 12px;
    cursor: pointer;
    user-select: none;
    border: 1px solid rgba(255,255,255,0.15);
  }
  .legend .item.off { opacity: 0.35; }
  .legend .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

  #map { position: absolute; top: 78px; bottom: 0; left: 0; right: 0; }
  @media (min-width: 700px) {
    #map { top: 62px; }
    .header { flex-wrap: nowrap; }
  }

  .leaflet-popup-content-wrapper { border-radius: 8px; }
  .popup-title { font-weight: 700; font-size: 13.5px; color: var(--ink); margin-bottom: 2px; }
  .popup-desc { font-size: 11.5px; color: #556; }
  .popup-day { display: inline-block; font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700; color: #fff; padding: 1px 7px; border-radius: 8px; margin-bottom: 5px; }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>País Vasco en 4 días</h1>
    <div class="sub">San Sebastián, Bilbao y costa guipuzcoana · haz clic en los días para mostrar u ocultar</div>
  </div>
  <div class="legend" id="legend"></div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // Definición de días, puntos y rutas
  const dayData = [
    {
      id: 1, label: 'Día 1 · Llegada', color: '#123c44',
      points: [
        { name: 'San Sebastián (base)', lat: 43.318237, lng: -1.981705, desc: 'Alojamiento fijo los 4 días' },
        { name: 'Playa de La Concha', lat: 43.318619, lng: -1.986012, desc: 'Playa urbana, paseo marítimo' }
      ]
    },
    {
      id: 2, label: 'Día 2 · SS + frontera', color: '#c0483c',
      points: [
        { name: 'Peine del Viento', lat: 43.321806, lng: -2.005389, desc: 'Escultura de Chillida al final de La Concha' },
        { name: 'Paseo Donibane', lat: 43.326806, lng: -1.989997, desc: 'Paseo por el barrio pesquero junto a la bahía' },
        { name: 'Sierra de Jaizkibel (mirador Guadalupe)', lat: 43.366767, lng: -1.821192, desc: 'Carretera panorámica sobre el Cantábrico' },
        { name: 'Hondarribia', lat: 43.364206, lng: -1.792580, desc: 'Casco histórico fronterizo' },
        { name: 'Hendaya (Francia)', lat: 43.374171, lng: -1.780053, desc: 'Playa y paseo marítimo en Francia' },
        { name: 'Irún', lat: 43.338271, lng: -1.789194, desc: 'Casco antiguo, parada rápida antes de volver' }
      ]
    },
    {
      id: 3, label: 'Día 3 · Bilbao', color: '#1c5763',
      points: [
        { name: 'Museo Guggenheim', lat: 43.268671, lng: -2.934012, desc: 'Arquitectura de Frank Gehry junto a la ría' },
        { name: 'Casco Viejo de Bilbao', lat: 43.259566, lng: -2.923840, desc: 'Callejeo y comida en el núcleo histórico' },
        { name: 'Meñakoz Hondartza', lat: 43.395137, lng: -2.985297, desc: 'Cala salvaje con acantilados en Barrika, muy surfeada por expertos' }
      ]
    },
    {
      id: 4, label: 'Día 4 · Costa guipuzcoana', color: '#5b6a70',
      points: [
        { name: 'Zarautz — sesión de surf', lat: 43.288161, lng: -2.168050, desc: 'Playa larga con varias escuelas de surf' },
        { name: 'Getaria', lat: 43.302858, lng: -2.204608, desc: 'Paseo marítimo junto al puerto pesquero' },
        { name: 'Faro de Zumaia', lat: 43.302116, lng: -2.251068, desc: 'Mirador sobre los acantilados del Flysch' },
        { name: 'Playa de Itzurun', lat: 43.300440, lng: -2.260058, desc: 'Flysch de Zumaia, playa bajo los acantilados' }
      ]
    }
  ];

  const map = L.map('map', { zoomControl: true }).setView([43.34, -2.25], 9);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    maxZoom: 18
  }).addTo(map);

  const layerGroups = {};
  const allBounds = [];

  dayData.forEach(day => {
    const group = L.layerGroup().addTo(map);
    const latlngs = [];

    day.points.forEach((p, idx) => {
      const marker = L.circleMarker([p.lat, p.lng], {
        radius: 8,
        fillColor: day.color,
        color: '#fff',
        weight: 2,
        fillOpacity: 1
      });
      marker.bindPopup(
        `<div class="popup-day" style="background:${day.color}">${day.label}</div>` +
        `<div class="popup-title">${idx + 1}. ${p.name}</div>` +
        `<div class="popup-desc">${p.desc}</div>`
      );
      marker.addTo(group);
      latlngs.push([p.lat, p.lng]);
      allBounds.push([p.lat, p.lng]);
    });

    if (latlngs.length > 1) {
      L.polyline(latlngs, { color: day.color, weight: 3, opacity: 0.65, dashArray: '6 6' }).addTo(group);
    }

    layerGroups[day.id] = group;
  });

  map.fitBounds(allBounds, { padding: [30, 30] });

  // Leyenda interactiva
  const legend = document.getElementById('legend');
  dayData.forEach(day => {
    const item = document.createElement('div');
    item.className = 'item';
    item.innerHTML = `<span class="dot" style="background:${day.color}"></span><span>${day.label}</span>`;
    item.addEventListener('click', () => {
      const group = layerGroups[day.id];
      if (map.hasLayer(group)) {
        map.removeLayer(group);
        item.classList.add('off');
      } else {
        map.addLayer(group);
        item.classList.remove('off');
      }
    });
    legend.appendChild(item);
  });
</script>

</body>
</html>
